<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机售票员</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% 0%,#102a3f 0%,#05080c 70%);
    color:#e8eef5;min-height:100vh;display:flex;justify-content:center;padding:14px;user-select:none}
  #app{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h1{font-size:19px;letter-spacing:2px;color:#7fd1ff}
  .stats{display:flex;gap:7px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.055);border:1px solid rgba(127,209,255,.2);border-radius:8px;
    padding:4px 11px;font-size:11.5px;min-width:78px;text-align:center}
  .stat b{display:block;font-size:15px;color:#7fd1ff;margin-top:1px}
  .panel{background:rgba(255,255,255,.05);border:1px solid rgba(127,209,255,.18);
    border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .passenger{display:flex;gap:14px;align-items:center}
  .avatar{width:72px;height:88px;border-radius:8px;overflow:hidden;border:2px solid #7fd1ff33;
    background:#0c1620;flex:0 0 auto}
  .avatar svg{width:100%;height:100%}
  .info{font-size:13px;line-height:1.7;flex:1;min-width:0}
  .info b{color:#7fd1ff}
  .bad{color:#ff6b6b;font-weight:700}.good{color:#5ee7a0;font-weight:700}
  .flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .flight{background:rgba(0,0,0,.28);border:1px solid rgba(127,209,255,.16);border-radius:11px;
    padding:10px 12px;cursor:pointer;transition:.15s;font-size:12.5px;line-height:1.6}
  .flight:hover{border-color:#7fd1ff;background:rgba(127,209,255,.08)}
  .flight.selected{border-color:#5ee7a0;box-shadow:0 0 16px rgba(94,231,160,.25)}
  .flight b{color:#7fd1ff;font-size:13.5px}
  .flight .meta{color:#9fb3c8;font-size:11.5px}
  .flight .price{color:#5ee7a0;font-weight:700}
  .actions{display:flex;gap:9px}
  button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;
    cursor:pointer;letter-spacing:1.5px;transition:.14s}
  #sell{background:linear-gradient(180deg,#6ff0ad,#2fbf74);color:#06121b}
  #refuse{background:linear-gradient(180deg,#ff9a9a,#e04b4b);color:#fff}
  #sell:disabled{background:#3a4b5c;color:#7a8b9c;cursor:not-allowed}
  .feedback{min-height:40px;font-size:12.5px;text-align:center;line-height:1.55;
    background:rgba(0,0,0,.3);border-radius:8px;padding:6px 9px;border:1px solid rgba(127,209,255,.12)}
  .hint{font-size:11px;color:#8aa0b5;text-align:center;line-height:1.55}
  @media(max-width:600px){.passenger{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✈️ 飞机售票员</h1>
    <div class="stats">
      <div class="stat">收入<b id="money">$0</b></div>
      <div class="stat">投诉<b id="complaints">0</b></div>
      <div class="stat">已售票<b id="sold">0</b></div>
    </div>
  </header>
  <div class="panel">
    <div class="passenger">
      <div class="avatar" id="avatar"></div>
      <div class="info" id="info"></div>
    </div>
  </div>
  <div class="panel">
    <div class="hint" style="text-align:left;color:#7fd1ff;letter-spacing:1px">今日可选航班（点击选择）</div>
    <div class="flights" id="flights"></div>
  </div>
  <div class="actions">
    <button id="sell" disabled>✅ 售票</button>
    <button id="refuse">⛔ 拒绝</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="hint">旅客有证件、年龄、目的地、预算、行李要求。选错航班会被投诉，投诉 5 次关门。</div>
</div>

<script>
const $=id=>document.getElementById(id);
const names=['阿列克谢','贝拉','卡洛斯','达莉亚','伊万','法蒂玛','格奥尔基','汉娜','尤里','泽维尔',
'李明','王芳','佐藤','金敏','拉吉','安娜'];
const skins=['#f3d0ae','#e0b48c','#c98f5f','#a86b3c','#8a5227','#f7ddc4'];
const hairs=['#141414','#2a1a10','#4a2e1a','#6b4a2b','#a0522d','#c9b28a','#8c8c8c'];
const cities=['北京','上海','东京','首尔','新加坡','曼谷','迪拜','伦敦','巴黎','纽约','悉尼','莫斯科'];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

let state={money:0,complaints:0,sold:0,current:null,flights:[],selected:null};

function makeFlights(){
  const list=[];const n=randInt(3,4);const used=new Set();
  while(list.length<n){
    const dest=rand(cities);
    if(used.has(dest))continue;
    used.add(dest);
    const seats=randInt(0,6);
    const price=randInt(120,980);
    const baggage=rand(['无托运行李','1 件 23kg','2 件 23kg','仅手提']);
    const time=rand(['08:20','11:45','14:10','17:30','20:05','23:40']);
    const visaRequired=Math.random()<.3;
    list.push({dest,seats,price,baggage,time,visaRequired});
  }
  return list;
}
function makePassenger(){
  const dest=rand(cities);
  return{
    name:rand(names),age:randInt(3,75),dest,
    budget:randInt(100,900),
    baggage:rand(['无托运行李','1 件 23kg','2 件 23kg','仅手提']),
    hasVisa:Math.random()>.25,needsVisa:Math.random()<.4,
    skin:rand(skins),hair:rand(hairs),hairStyle:randInt(0,2),
    passportOk:Math.random()>.1
  };
}
function avatarSVG(p){
  const hair=['<path d="M14 40 q1 -25 19 -25 q18 0 19 25 q-3 -13 -19 -13 q-16 0 -19 13 Z" fill="'+p.hair+'"/>',
  '<path d="M12 42 q-2 16 2 26 q4 -11 5 -20 q4 -9 14 -9 q10 0 14 9 q1 9 5 20 q4 -10 2 -26 q-5 -15 -21 -15 q-16 0 -21 15 Z" fill="'+p.hair+'"/>',
  '<path d="M15 39 q3 -16 18 -16 q15 0 18 16 q-3 -6 -18 -6 q-15 0 -18 6 Z" fill="'+p.hair+'" opacity=".85"/>'][p.hairStyle];
  return '<svg viewBox="0 0 66 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="66" height="80" fill="#cfd8e0"/><rect y="58" width="66" height="22" fill="#3a4b5c"/><ellipse cx="14" cy="38" rx="3" ry="4.5" fill="'+p.skin+'"/><ellipse cx="52" cy="38" rx="3" ry="4.5" fill="'+p.skin+'"/>'+hair+'<ellipse cx="33" cy="37" rx="18" ry="21" fill="'+p.skin+'"/><ellipse cx="26" cy="36" rx="2.3" ry="2.9" fill="#141414"/><ellipse cx="40" cy="36" rx="2.3" ry="2.9" fill="#141414"/><path d="M28 47 q5 4 10 0" stroke="#8d4a3a" stroke-width="1.7" fill="none"/><rect x="18" y="58" width="30" height="22" fill="#24384a"/><path d="M28 58 l5 8 l5 -8" stroke="#0c1620" stroke-width="2" fill="none"/></svg>';
}
function renderPassenger(){
  const p=state.current;
  $('avatar').innerHTML=avatarSVG(p);
  const visaText=p.needsVisa?(p.hasVisa?'<span class="good">有签证</span>':'<span class="bad">无签证</span>'):'免签';
  $('info').innerHTML='<div><b>'+p.name+'</b> · '+p.age+' 岁</div>'+
    '<div>目的地：<b>'+p.dest+'</b> · 预算：<span class="good">$'+p.budget+'</span></div>'+
    '<div>行李：'+p.baggage+' · 证件：'+(p.passportOk?'<span class="good">有效</span>':'<span class="bad">有问题</span>')+' · '+visaText+'</div>';
}
function renderFlights(){
  $('flights').innerHTML=state.flights.map((f,i)=>
    '<div class="flight '+(state.selected===i?'selected':'')+'" data-i="'+i+'"><b>'+f.dest+'</b> · '+f.time+
    '<br><span class="meta">余票 '+f.seats+' · '+f.baggage+(f.visaRequired?' · 需签证':'')+'</span><br>'+
    '<span class="price">$'+f.price+'</span></div>').join('');
  $('flights').querySelectorAll('.flight').forEach(el=>{
    el.onclick=()=>{state.selected=+el.dataset.i;renderFlights();$('sell').disabled=false;};
  });
}
function checkSale(f){
  const p=state.current;const issues=[];
  if(!p.passportOk)issues.push('证件无效');
  if(p.needsVisa&&!p.hasVisa)issues.push('目的地需要签证，旅客没有');
  if(f.dest!==p.dest)issues.push('目的地不符：旅客要去 '+p.dest+'，这班飞 '+f.dest);
  if(f.seats<=0)issues.push('该航班已无余票');
  if(f.price>p.budget)issues.push('票价 $'+f.price+' 超出旅客预算 $'+p.budget);
  if(p.baggage!==f.baggage&&p.baggage!=='仅手提')issues.push('行李额度不符：旅客需要 '+p.baggage+'，航班为 '+f.baggage);
  return issues;
}
function sell(){
  if(state.selected===null)return;
  const f=state.flights[state.selected];
  const issues=checkSale(f);
  if(issues.length){
    state.complaints++;
    $('feedback').innerHTML='<span class="bad">❌ 售票失败：</span>'+issues.join('；');
    $('complaints').textContent=state.complaints;
    if(state.complaints>=5){setTimeout(()=>{alert('投诉满 5 次，售票窗口关闭。');location.reload();},700);}
    return;
  }
  const fee=Math.round(f.price*0.15);
  state.money+=fee;state.sold++;f.seats--;
  $('feedback').innerHTML='<span class="good">✅ 售票成功！</span> 佣金 +$'+fee+'。';
  $('money').textContent='$'+state.money;
  $('sold').textContent=state.sold;
  nextPassenger();
}
function refuse(){
  const f=state.selected!==null?state.flights[state.selected]:null;
  if(f){
    const issues=checkSale(f);
    if(issues.length===0){
      state.complaints++;
      $('feedback').innerHTML='<span class="bad">❌ 拒绝错误：</span>这单其实可以卖。投诉 +1。';
      $('complaints').textContent=state.complaints;
      if(state.complaints>=5){setTimeout(()=>{alert('投诉满 5 次，售票窗口关闭。');location.reload();},700);}
      return;
    }
  }
  $('feedback').innerHTML='<span class="good">✅ 拒绝合理。</span> 旅客被转去其他窗口。';
  nextPassenger();
}
function nextPassenger(){
  state.current=makePassenger();
  state.flights=makeFlights();
  state.selected=null;
  $('sell').disabled=true;
  renderPassenger();renderFlights();
}
$('sell').onclick=sell;
$('refuse').onclick=refuse;
nextPassenger();
</script>
</body>
</html>
