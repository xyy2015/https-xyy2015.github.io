<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 赛车</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#05080c;color:#e8eef5;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:10px;user-select:none;overflow:hidden}
  h1{font-size:18px;letter-spacing:3px;color:#7fd1ff}
  #hud{display:flex;gap:14px;font-size:13px;color:#9fb3c8;flex-wrap:wrap;justify-content:center}
  #hud b{color:#5ee7a0}
  canvas{background:#0a1420;border:2px solid #2a3a4a;border-radius:12px;max-width:100%;touch-action:none}
  .pad{display:flex;gap:10px;margin-top:2px}
  .pad button{width:110px;height:46px;border:1px solid rgba(127,209,255,.35);
    background:rgba(127,209,255,.08);color:#7fd1ff;border-radius:10px;font-size:20px;
    cursor:pointer;transition:.12s}
  .pad button:active{background:rgba(127,209,255,.25);transform:scale(.96)}
  .hint{font-size:11px;color:#5a7a96;text-align:center;line-height:1.45}
  #restart{padding:7px 16px;border:none;border-radius:8px;background:#7fd1ff;color:#06121b;
    font-weight:700;cursor:pointer;letter-spacing:1px}
</style>
</head>
<body>
  <h1>🏎️ 3D 赛车</h1>
  <div id="hud">速度 <b id="speed">0</b> · 得分 <b id="score">0</b> · 最佳 <b id="best">0</b></div>
  <canvas id="game" width="460" height="500"></canvas>
  <div class="pad">
    <button data-dir="left">◀</button>
    <button data-dir="right">▶</button>
  </div>
  <div class="hint">左右方向键或按钮变道 · 躲开车辆 · 撞车结束</div>
  <button id="restart">重开</button>

<script>
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const roadTopW=120,roadBotW=400,roadTopY=110,roadBotY=H-36,centerX=W/2;
const USER=localStorage.getItem('game_user')||'guest';
const SAVE_KEY='racing_best_'+USER;

let S=null;

function laneX(lane,z){
  const t=1-z, w=roadTopW+(roadBotW-roadTopW)*t;
  return centerX-w/2+(w/3)*(lane+0.5);
}
function roadY(z){return roadTopY+(roadBotY-roadTopY)*z;}

function loadBest(){
  try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}').best||0;}catch(e){return 0;}
}
function saveBest(){
  if(S.score>S.best){
    S.best=S.score;
    localStorage.setItem(SAVE_KEY,JSON.stringify({best:S.best}));
    $('best').textContent=S.best;
  }
}

function init(){
  S={
    targetLane:1, lanePos:1,
    speed:0, score:0, best:loadBest(),
    obstacles:[], stripe:0, running:true,
    spawnTimer:1.0, acc:0
  };
  $('best').textContent=S.best;
  $('score').textContent=0;
  $('speed').textContent=60;
}

function spawn(){
  const lane=Math.floor(Math.random()*3);
  if(S.obstacles.some(o=>o.lane===lane&&o.z>0.78))return;
  S.obstacles.push({
    lane, z:0.02,
    type:Math.random()<0.18?'truck':'car',
    color:['#e94560','#f5a623','#50e3c2','#4a90e2','#c084fc'][Math.floor(Math.random()*5)]
  });
}

function drawRoad(){
  const sky=ctx.createLinearGradient(0,0,0,roadTopY);
  sky.addColorStop(0,'#0b1a2c');sky.addColorStop(1,'#1a3550');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,roadTopY);

  ctx.fillStyle='#0a1626';
  ctx.beginPath();
  ctx.moveTo(0,roadTopY);ctx.lineTo(70,roadTopY-36);ctx.lineTo(150,roadTopY-8);
  ctx.lineTo(250,roadTopY-50);ctx.lineTo(350,roadTopY-12);ctx.lineTo(430,roadTopY-40);
  ctx.lineTo(W,roadTopY-4);ctx.lineTo(W,roadTopY);ctx.closePath();ctx.fill();

  const ground=ctx.createLinearGradient(0,roadTopY,0,H);
  ground.addColorStop(0,'#12202e');ground.addColorStop(1,'#070d14');
  ctx.fillStyle=ground;ctx.fillRect(0,roadTopY,W,H-roadTopY);

  ctx.fillStyle='#1a2430';
  ctx.beginPath();
  ctx.moveTo(centerX-roadTopW/2,roadTopY);ctx.lineTo(centerX+roadTopW/2,roadTopY);
  ctx.lineTo(centerX+roadBotW/2,roadBotY);ctx.lineTo(centerX-roadBotW/2,roadBotY);
  ctx.closePath();ctx.fill();

  ctx.strokeStyle='#2f4356';ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(centerX-roadTopW/2,roadTopY);ctx.lineTo(centerX-roadBotW/2,roadBotY);
  ctx.moveTo(centerX+roadTopW/2,roadTopY);ctx.lineTo(centerX+roadBotW/2,roadBotY);
  ctx.stroke();

  for(let lane=1;lane<3;lane++){
    const xTop=centerX-roadTopW/2+roadTopW/3*lane;
    const xBot=centerX-roadBotW/2+roadBotW/3*lane;
    ctx.strokeStyle='rgba(232,238,245,.32)';ctx.lineWidth=2;
    ctx.setLineDash([12,16]);ctx.lineDashOffset=-S.stripe;
    ctx.beginPath();ctx.moveTo(xTop,roadTopY);ctx.lineTo(xBot,roadBotY);ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawObstacle(o){
  const z=o.z,y=roadY(z),x=laneX(o.lane,z);
  const s=0.22+0.78*(1-z);
  const cw=44*s,ch=(o.type==='truck'?74:56)*s;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(0,2,cw*0.55,6*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=o.color;
  ctx.beginPath();ctx.roundRect(-cw/2,-ch,cw,ch,6*s);ctx.fill();
  ctx.fillStyle='rgba(10,20,30,.75)';
  ctx.beginPath();ctx.roundRect(-cw/2+4*s,-ch+7*s,cw-8*s,ch*0.3,4*s);ctx.fill();
  ctx.fillStyle='#0a0f14';
  ctx.fillRect(-cw/2-2*s,-ch*0.3,3*s,ch*0.2);
  ctx.fillRect(cw/2-1*s,-ch*0.3,3*s,ch*0.2);
  ctx.fillStyle='#ff4b4b';
  ctx.fillRect(-cw/2+3*s,-5*s,7*s,3*s);
  ctx.fillRect(cw/2-10*s,-5*s,7*s,3*s);
  ctx.restore();
}

function drawPlayer(){
  const z=0.05,y=roadY(z),x=laneX(S.lanePos,z);
  const cw=60,ch=84;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.ellipse(0,3,cw*0.55,9,0,0,Math.PI*2);ctx.fill();
  const g=ctx.createLinearGradient(0,-ch,0,0);
  g.addColorStop(0,'#5ee7a0');g.addColorStop(1,'#1b8a55');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(-cw/2,-ch,cw,ch,10);ctx.fill();
  ctx.fillStyle='rgba(180,230,255,.6)';
  ctx.beginPath();ctx.roundRect(-cw/2+8,-ch+10,cw-16,ch*0.26,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.fillRect(-3,-ch+8,6,ch*0.48);
  ctx.fillStyle='#0a0f14';
  ctx.fillRect(-cw/2-4,-ch*0.7,5,ch*0.22);
  ctx.fillRect(cw/2-1,-ch*0.7,5,ch*0.22);
  ctx.fillRect(-cw/2-4,-ch*0.25,5,ch*0.22);
  ctx.fillRect(cw/2-1,-ch*0.25,5,ch*0.22);
  ctx.fillStyle='#fff3c4';
  ctx.fillRect(-cw/2+5,-ch+4,10,5);
  ctx.fillRect(cw/2-15,-ch+4,10,5);
  ctx.restore();
}

// 固定步长：每 1/60 秒执行一次逻辑，避免不同刷新率导致手感差异
function step(dt){
  if(!S.running)return;

  const diff=S.targetLane-S.lanePos;
  S.lanePos+=diff*Math.min(1,dt*9);
  if(Math.abs(diff)<0.005)S.lanePos=S.targetLane;

  S.speed=Math.min(1,S.speed+dt*0.035);
  S.stripe=(S.stripe+(150+S.speed*300)*dt)%28;

  S.spawnTimer-=dt;
  if(S.spawnTimer<=0){
    spawn();
    S.spawnTimer=Math.max(0.55,1.2-S.speed*0.5);
  }

  for(const o of S.obstacles)o.z-=dt*(0.34+S.speed*0.62);
  S.obstacles=S.obstacles.filter(o=>o.z>0);

  for(const o of S.obstacles){
    if(o.z<0.11&&o.lane===Math.round(S.lanePos)){
      S.running=false;saveBest();
      setTimeout(()=>alert('撞车！得分：'+S.score),60);
      return;
    }
  }

  S.score+=Math.floor(dt*30*(1+S.speed));
  $('score').textContent=S.score;
  $('speed').textContent=Math.floor(60+S.speed*180);
}

function render(){
  drawRoad();
  const sorted=[...S.obstacles].sort((a,b)=>b.z-a.z);
  for(const o of sorted)drawObstacle(o);
  drawPlayer();
}

let last=0, acc=0;
function loop(t){
  if(!last)last=t;
  let dt=(t-last)/1000; last=t;
  if(dt>0.1)dt=0.1;
  acc+=dt;
  while(acc>=1/60){ step(1/60); acc-=1/60; }
  render();
  requestAnimationFrame(loop);
}

function setDir(d){
  if(!S.running)return;
  if(d==='left'&&S.targetLane>0)S.targetLane--;
  if(d==='right'&&S.targetLane<2)S.targetLane++;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')setDir('left');
  if(e.key==='ArrowRight')setDir('right');
  if(e.key===' ')init();
});
document.querySelectorAll('.pad button').forEach(b=>{b.onclick=()=>setDir(b.dataset.dir);});
$('restart').onclick=init;

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
