<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏大厅</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% 0%,#12233a 0%,#05080c 70%);
    color:#e8eef5;min-height:100vh;display:flex;justify-content:center;
    align-items:flex-start;padding:28px 16px}
  #lock{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;
    background:radial-gradient(circle at 50% 30%,#0b1a2c,#03060a);padding:20px}
  #lock h2{font-size:22px;letter-spacing:3px;color:#7fd1ff;text-shadow:0 0 16px rgba(127,209,255,.5)}
  #lock p{font-size:13px;color:#8aa0b5;line-height:1.7;max-width:380px}
  .lock-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #pass{width:240px;padding:12px 16px;border-radius:10px;border:1px solid rgba(127,209,255,.35);
    background:rgba(255,255,255,.06);color:#e8eef5;font-size:17px;letter-spacing:5px;
    text-align:center;outline:none;font-family:"Courier New",monospace}
  #pass:focus{border-color:#7fd1ff;box-shadow:0 0 14px rgba(127,209,255,.35)}
  #enter{padding:12px 22px;border:none;border-radius:10px;font-size:15px;font-weight:700;
    cursor:pointer;letter-spacing:2px;background:linear-gradient(180deg,#6ff0ad,#2fbf74);
    color:#06121b}
  #msg{min-height:22px;font-size:13px;color:#ff6b6b;letter-spacing:1px}
  #hall{display:none;flex-direction:column;align-items:center;width:100%}
  h1{font-size:26px;letter-spacing:4px;color:#7fd1ff;text-shadow:0 0 18px rgba(127,209,255,.5);margin-bottom:6px}
  .sub{font-size:13px;color:#8aa0b5;margin-bottom:26px;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;
    width:100%;max-width:980px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid rgba(127,209,255,.22);border-radius:16px;padding:20px;text-decoration:none;
    color:#e8eef5;display:flex;flex-direction:column;gap:8px;transition:.18s}
  .card:hover{transform:translateY(-4px);border-color:#7fd1ff;box-shadow:0 12px 30px rgba(127,209,255,.18)}
  .card .icon{font-size:38px}
  .card h2{font-size:18px;letter-spacing:1px;color:#7fd1ff}
  .card p{font-size:12.5px;color:#9fb3c8;line-height:1.6}
  .card .tag{font-size:10.5px;color:#5ee7a0;letter-spacing:1px;margin-top:auto}
  footer{margin-top:30px;font-size:11.5px;color:#5a7a96;letter-spacing:1px}
</style>
</head>
<body>

<div id="lock">
  <h2>🔒 访问验证</h2>
  <p>请输入访问密码后进入游戏大厅。</p>
  <div class="lock-row">
    <input id="pass" type="password" inputmode="numeric" maxlength="10" placeholder="••••••••••" autocomplete="off">
    <button id="enter">进入</button>
  </div>
  <div id="msg"></div>
</div>

<div id="hall">
  <h1>🎮 游戏大厅</h1>
  <div class="sub">五个游戏 · 点击进入</div>
  <div class="grid">
    <a class="card" href="border-checkpoint.html">
      <div class="icon">🛂</div>
      <h2>边境检查站</h2>
      <p>夜班检查站，对照 24 条规则判断放行或拦截。</p>
      <div class="tag">模拟 · 判断</div>
    </a>
    <a class="card" href="ticket-agent.html">
      <div class="icon">✈️</div>
      <h2>飞机售票员</h2>
      <p>给旅客安排航班、核对证件、处理预算和行李。</p>
      <div class="tag">经营 · 售票</div>
    </a>
    <a class="card" href="snake.html">
      <div class="icon">🐍</div>
      <h2>贪吃蛇</h2>
      <p>经典贪吃蛇，方向键或触屏按钮控制。</p>
      <div class="tag">街机</div>
    </a>
    <a class="card" href="breakout.html">
      <div class="icon">🧱</div>
      <h2>打砖块</h2>
      <p>移动挡板接球，打掉所有砖块。</p>
      <div class="tag">街机</div>
    </a>
    <a class="card" href="racing3d.html">
      <div class="icon">🏎️</div>
      <h2>3D 赛车</h2>
      <p>伪 3D 赛道，左右变道躲车，速度越来越快。</p>
      <div class="tag">竞速 · 3D 视觉</div>
    </a>
  </div>
  <footer>GitHub Pages · 静态游戏合集</footer>
</div>

<script>
(function(){
  var CODE = '2947638100';
  var lock = document.getElementById('lock');
  var hall = document.getElementById('hall');
  var input = document.getElementById('pass');
  var msg = document.getElementById('msg');

  function unlock(){
    if(input.value.trim() === CODE){
      lock.parentNode.removeChild(lock);
      hall.style.display = 'flex';
    }else{
      msg.textContent = '密码错误，请重新输入。';
      input.value = '';
      input.focus();
    }
  }
  document.getElementById('enter').onclick = unlock;
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') unlock();
  });
  input.focus();
})();
</script>
</body>
</html>
