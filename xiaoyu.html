<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233ddc84' d='M7 6h10a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4z'/%3E%3Ccircle cx='9' cy='12.5' r='1.4' fill='%23070b0a'/%3E%3Ccircle cx='15' cy='12.5' r='1.4' fill='%23070b0a'/%3E%3Crect x='8.4' y='8' width='1.4' height='2' rx='.7' fill='%23070b0a'/%3E%3Crect x='14.2' y='8' width='1.4' height='2' rx='.7' fill='%23070b0a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070b0a; --panel:#0d1412; --panel2:#111a17; --line:#1c2a24;
    --green:#3ddc84; --teal:#2bd4c0; --text:#d7f5e4; --muted:#7f9a8d;
    --danger:#ff5d6c; --amber:#ffc75f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    overflow:hidden;
  }
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(61,220,132,.10), transparent 60%),
      radial-gradient(700px 420px at 10% 110%, rgba(43,212,192,.08), transparent 60%),
      var(--bg);
  }
  .bg-grid::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(61,220,132,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,220,132,.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 80%);
  }
  .app{position:relative; z-index:1; height:100vh; display:flex; flex-direction:column}

  .login-mask{
    position:fixed; inset:0; z-index:50;
    background:rgba(5,9,8,.92); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    width:100%; max-width:360px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:28px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .login-box .logo{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .login-box .logo svg{width:34px;height:34px}
  .login-box h1{font-size:22px; letter-spacing:.5px}
  .login-box .sub{color:var(--muted); font-size:13px; margin-bottom:20px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  .field input{
    width:100%; height:44px; padding:0 14px; font-size:16px; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:10px; outline:none;
  }
  .field input:focus{border-color:var(--green); box-shadow:0 0 0 3px rgba(61,220,132,.15)}
  .btn{
    width:100%; height:44px; border:none; border-radius:10px; cursor:pointer; font-size:15px; font-weight:600;
  }
  .btn-primary{background:var(--green); color:#06231a}
  .btn-primary:hover{background:#4cf094}
  .login-err{color:var(--danger); font-size:13px; min-height:18px; margin-top:10px}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; letter-spacing:.5px}
  .brand svg{width:26px;height:26px}
  .brand span{background:linear-gradient(90deg,var(--green),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .userbox{display:flex; align-items:center; gap:12px}
  .who{font-size:14px; color:var(--text)}
  .who b{color:var(--green)}
  .btn-mini{
    height:34px; padding:0 14px; font-size:13px; border-radius:8px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--muted);
  }
  .btn-mini:hover{border-color:var(--danger); color:var(--danger)}

  .main{flex:1; overflow-y:auto; padding:26px 22px 40px}
  .main::-webkit-scrollbar{width:10px}
  .main::-webkit-scrollbar-thumb{background:#1c2a24; border-radius:5px}
  .section-title{font-size:15px; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:8px}
  .section-title::before{content:""; width:3px; height:14px; background:var(--green); border-radius:2px}
  .games{display:grid; grid-template-columns:repeat(1,1fr); gap:16px}
  @media(min-width:500px){.games{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:820px){.games{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1200px){.games{grid-template-columns:repeat(4,1fr)}}
  .game-card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column;
  }
  .game-card:hover{transform:translateY(-4px); border-color:var(--green); box-shadow:0 14px 34px rgba(0,0,0,.45)}
  .game-thumb{
    height:120px; display:flex; align-items:center; justify-content:center; position:relative;
    background:
      radial-gradient(220px 120px at 30% 20%, rgba(61,220,132,.22), transparent 70%),
      radial-gradient(220px 120px at 80% 90%, rgba(43,212,192,.18), transparent 70%),
      #0a120e;
  }
  .game-thumb .play{
    position:absolute; width:46px;height:46px; border-radius:50%;
    background:rgba(61,220,132,.9); display:flex;align-items:center;justify-content:center;
    color:#06231a; opacity:0; transform:scale(.7); transition:.18s;
  }
  .game-card:hover .play{opacity:1; transform:scale(1)}
  .game-thumb svg.badge{width:52px;height:52px; opacity:.9}
  .game-info{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
  .game-title{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px}
  .tag{font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(255,199,95,.12); color:var(--amber); border:1px solid rgba(255,199,95,.25)}
  .game-desc{font-size:13px; color:var(--muted); line-height:1.6; flex:1}
  .empty{color:var(--muted); text-align:center; padding:60px 0; font-size:14px}
  footer{padding:12px 22px; border-top:1px solid var(--line); color:#4c6157; font-size:12px; text-align:center}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="app">
  <header class="topbar" id="topbar" style="display:none">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 6h10a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4z"/><circle cx="9" cy="12.5" r="1.5" fill="#070b0a"/><circle cx="15" cy="12.5" r="1.5" fill="#070b0a"/><rect x="8.3" y="8" width="1.5" height="2" rx=".75" fill="#070b0a"/><rect x="14.2" y="8" width="1.5" height="2" rx=".75" fill="#070b0a"/></svg>
      <span>游戏站</span>
    </div>
    <div class="userbox">
      <div class="who">已登录：<b id="who"></b></div>
      <button class="btn-mini" id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="main" id="main" style="display:none">
    <div class="section-title">游戏库</div>
    <div class="games" id="games"></div>
  </main>

  <footer>本地游戏站 · 支持 GitHub Pages 部署</footer>
</div>

<div class="login-mask" id="loginMask">
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 24 24" style="color:var(--green)"><path fill="currentColor" d="M7 6h10a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4z"/><circle cx="9" cy="12.5" r="1.5" fill="#06231a"/><circle cx="15" cy="12.5" r="1.5" fill="#06231a"/><rect x="8.3" y="8" width="1.5" height="2" rx=".75" fill="#06231a"/><rect x="14.2" y="8" width="1.5" height="2" rx=".75" fill="#06231a"/></svg>
      <h1>游戏站</h1>
    </div>
    <div class="sub">登录后可进入游戏，进度按账号分别存档</div>
    <div class="field"><label>账号</label><input id="inUser" autocomplete="off" autofocus></div>
    <div class="field"><label>密码</label><input id="inPass" type="password"></div>
    <button class="btn btn-primary" id="loginBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<script>
var ACCOUNTS = {
  "thy2014": "thy20141005",
  "GHBQU":   "GHBQU",
  "lyb2015": "lyb2015",
  "lcx2015": "lcx2015",
  "66":      "66"
};

var DEFAULT_GAMES = [
  { id:"roguelike", title:"割草肉鸽", desc:"类吸血鬼幸存者的割草肉鸽游戏：自动攻击、升级三选一卡牌强化技能，血量与经验值成长，进度可存档。", file:"games/roguelike.html", tag:"肉鸽" },
  { id:"mc-id-check", title:"请出示你的证件", desc:"我的世界风格像素门卫小游戏：核对访客证件，按每日规定放行或拒绝，三天通关联赛，失误三次被撤职。", file:"games/mc-id-check.html", tag:"像素" },
  { id:"geometry-survivor", title:"几何幸存者", desc:"CCW 的几何幸存者：控制几何图形在几何怪海中割草生存，越久越强。", file:"games/Geometry-Survivor.html", tag:"幸存者" },
  { id:"2048", title:"2048", desc:"经典数字合成游戏：合并相同数字冲向 2048，支持键盘与触屏，高分自动保存。", file:"games/2048.html", tag:"益智" },
  { id:"snake", title:"贪吃蛇", desc:"经典贪吃蛇：控制小蛇吃食物变长，别撞墙别咬自己，高分自动保存。", file:"games/snake.html", tag:"经典" }
];

var SESSION_KEY = "gstation_session";
var user = localStorage.getItem(SESSION_KEY) || "";

var GH = {
  owner: "thy2014",
  repo:  "-.-.gay",
  api:   "https://api.github.com"
};

var $ = function(id){ return document.getElementById(id); };

function tryLogin(){
  var u = $("inUser").value.trim();
  var p = $("inPass").value;
  $("loginErr").textContent = "";
  if(!u || !p){ $("loginErr").textContent = "请输入账号和密码"; return; }
  if(!(u in ACCOUNTS)){ $("loginErr").textContent = "账号不存在"; return; }
  if(ACCOUNTS[u] !== p){ $("loginErr").textContent = "密码错误"; return; }
  user = u;
  localStorage.setItem(SESSION_KEY, u);
  enterSite();
}
$("loginBtn").addEventListener("click", tryLogin);
$("inPass").addEventListener("keydown", function(e){ if(e.key==="Enter") tryLogin(); });
$("inUser").addEventListener("keydown", function(e){ if(e.key==="Enter") $("inPass").focus(); });

$("logoutBtn").addEventListener("click", function(){
  localStorage.removeItem(SESSION_KEY);
  user = "";
  $("loginMask").style.display = "flex";
  $("topbar").style.display = "none";
  $("main").style.display = "none";
  $("inPass").value = "";
  $("loginErr").textContent = "";
  $("inUser").focus();
});

if(user){ enterSite(); }

function enterSite(){
  $("loginMask").style.display = "none";
  $("topbar").style.display = "flex";
  $("main").style.display = "block";
  $("who").textContent = user;
  loadGames();
}

function renderGames(list){
  var box = $("games");
  box.innerHTML = "";
  if(!list.length){
    box.innerHTML = '<div class="empty">还没有游戏，往 games/ 文件夹添加 HTML 后即可显示</div>';
    return;
  }
  list.forEach(function(g){
    var card = document.createElement("div");
    card.className = "game-card";
    card.innerHTML =
      '<div class="game-thumb">' + thumbSVG(g) +
      '<div class="play">' + playSVG() + '</div></div>' +
      '<div class="game-info">' +
      '<div class="game-title">' + esc(g.title) + (g.tag?'<span class="tag">'+esc(g.tag)+'</span>':'') + '</div>' +
      '<div class="game-desc">' + esc(g.desc||"") + '</div></div>';
    card.addEventListener("click", function(){
      window.open(g.file + (g.file.indexOf("?")>=0?"&":"?") + "user=" + encodeURIComponent(user), "_self");
    });
    box.appendChild(card);
  });
}

function thumbSVG(g){
  return '<svg class="badge" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path fill="#070b0a" d="M12 3.2a8.8 8.8 0 1 1 0 17.6 8.8 8.8 0 0 1 0-17.6z"/><path fill="currentColor" d="M8 9l6-3-2 5 3 1-6 3 2-5z"/></svg>';
}
function playSVG(){
  return '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var CURRENT = DEFAULT_GAMES.slice();

function loadGames(){
  CURRENT = DEFAULT_GAMES.slice();
  renderGames(CURRENT);
  if(location.protocol === "file:") return;
  fetch("games/games.json", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      var merged = mergeGames(data ? data.games : []);
      renderGames(merged);
      autoScanGitHub();
    })
    .catch(function(){ autoScanGitHub(); });
}

function mergeGames(extra){
  var seen = {};
  CURRENT.forEach(function(g){ seen[String(g.file||"").toLowerCase()]=1; seen[String(g.id||"").toLowerCase()]=1; });
  var merged = CURRENT.slice();
  (extra||[]).forEach(function(g){
    if(!g || !g.file) return;
    var k = String(g.file).toLowerCase();
    if(seen[k]) return;
    seen[k]=1;
    if(g.id) seen[String(g.id).toLowerCase()]=1;
    merged.push(g);
  });
  CURRENT = merged;
  return merged;
}

function autoScanGitHub(){
  if(!GH || !GH.owner || !GH.repo) return;
  var url = GH.api.replace(/\/$/,"") + "/repos/" + encodeURIComponent(GH.owner) + "/" + encodeURIComponent(GH.repo) + "/contents/games";
  fetch(url, {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(list){
      if(!Array.isArray(list)) return;
      var extra = list.filter(function(f){ return /\.html$/i.test(f.name) && f.name.toLowerCase()!=="index.html"; })
        .map(function(f){
          var name = f.name.replace(/\.html$/i,"");
          return { id:name, title:name, desc:"从 games/ 文件夹自动发现", file:"games/"+f.name, tag:"html" };
        });
      if(!extra.length) return;
      renderGames(mergeGames(extra));
    })
    .catch(function(){});
}
</script>
</body>
</html>
