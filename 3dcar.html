<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>超跑竞速 · Hypercar Race</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; overflow: hidden; background: #0b1020;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    padding: 10px 14px; background: rgba(0,0,0,.55);
    border-radius: 10px; font-size: 13px; line-height: 1.7;
    pointer-events: none; backdrop-filter: blur(6px); min-width: 180px;
  }
  #hud .speed { font-size: 24px; font-weight: 800; color: #7dff9b; }
  #hud .label { color: #9aa7bd; font-size: 11px; letter-spacing: .5px; }
  #hud .pos { font-size: 18px; font-weight: 800; color: #ffd166; }
  #hud .lap { color: #c9d4e6; }

  #phaseText {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 25; font-size: 16px; font-weight: 700; color: #dce6f7;
    background: rgba(0,0,0,.5); padding: 6px 16px; border-radius: 999px;
    pointer-events: none; white-space: nowrap;
  }
  #startLights {
    position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
    z-index: 25; display: flex; gap: 12px; pointer-events: none;
  }
  .light {
    width: 42px; height: 42px; border-radius: 50%;
    background: #1a1f2c; border: 3px solid #2a3348;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.6);
    transition: background .1s, box-shadow .1s;
  }
  .light.red {
    background: #ff2b2b;
    box-shadow: 0 0 18px #ff2b2b, inset 0 0 8px #ff6b6b;
    border-color: #7a1010;
  }

  #minimapWrap {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    width: 170px; height: 170px;
    background: rgba(8,12,22,.62); border-radius: 12px;
    border: 1px solid #2a3654; overflow: hidden;
    pointer-events: none; backdrop-filter: blur(4px);
  }
  #minimap { width: 100%; height: 100%; display: block; }

  #touchLeft, #touchRight {
    position: fixed; bottom: 22px; z-index: 30;
    display: flex; gap: 12px; align-items: flex-end;
  }
  #touchLeft { left: 22px; }
  #touchRight { right: 22px; }
  .tb {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.22);
    background: rgba(20,30,50,.55);
    color: #e6eefc; font-size: 22px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); cursor: pointer;
    transition: background .08s, transform .08s;
    touch-action: none;
  }
  .tb.big { width: 84px; height: 84px; font-size: 15px; }
  .tb.active {
    background: rgba(79,124,255,.8);
    transform: scale(.94);
    border-color: rgba(150,180,255,.9);
  }
  .tb.brake.active { background: rgba(255,60,60,.8); border-color: rgba(255,140,140,.9); }

  #selection {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(circle at 50% 20%, #1c2747, #070b14 70%);
    padding: 18px; overflow-y: auto;
  }
  #selection h1 { margin: 4px 0 2px; font-size: clamp(22px, 4vw, 34px); }
  #selection p.sub { margin: 0 0 18px; color: #9aa7bd; font-size: 13px; }
  .section-title {
    width: min(980px, 100%); margin: 10px 0 8px;
    font-size: 13px; font-weight: 700; color: #9fb2d6;
    letter-spacing: .5px; text-transform: uppercase;
  }
  #tracks, #cars { display: grid; gap: 10px; width: min(980px, 100%); }
  #tracks { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  #cars { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card {
    cursor: pointer; border: 1px solid #2a3654;
    background: #121a2e; border-radius: 12px;
    padding: 12px; transition: .15s; text-align: left;
  }
  .card:hover { border-color: #4f7cff; background: #17213b; }
  .card.selected {
    border-color: #7dff9b; background: #16241f;
    box-shadow: 0 0 0 1px #7dff9b inset;
  }
  .card .name { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
  .card .meta { font-size: 11px; color: #9aa7bd; line-height: 1.6; }
  .card .meta b { color: #dce6f7; font-weight: 600; }
  #startBtn {
    margin: 18px 0 30px; cursor: pointer; border: 0;
    border-radius: 12px; padding: 14px 34px;
    font-size: 16px; font-weight: 800;
    background: #4f7cff; color: #fff;
    opacity: .4; pointer-events: none; transition: .15s;
  }
  #startBtn.ready { opacity: 1; pointer-events: auto; }
  #startBtn.ready:hover { background: #6a8fff; }

  #overlayMsg {
    position: fixed; inset: 0; z-index: 60;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(5,9,18,.82);
    text-align: center; padding: 24px;
  }
  #overlayMsg h2 { margin: 0 0 8px; font-size: 26px; }
  #overlayMsg p { margin: 0 0 18px; color: #a9b7cf; }
  #overlayMsg button {
    cursor: pointer; border: 0; border-radius: 10px;
    padding: 12px 22px; font-size: 15px; font-weight: 700;
    background: #4f7cff; color: #fff;
  }
</style>
</head>
<body>

<div id="hud">
  速度 <span class="speed" id="spd">0</span> km/h<br />
  圈数 <span class="lap" id="lap">-</span><br />
  名次 <span class="pos" id="pos">-</span><br />
  <span class="label" id="carLabel">—</span>
</div>

<div id="phaseText">选车准备</div>
<div id="startLights">
  <div class="light"></div><div class="light"></div><div class="light"></div>
  <div class="light"></div><div class="light"></div>
</div>

<div id="minimapWrap"><canvas id="minimap" width="340" height="340"></canvas></div>

<div id="touchLeft">
  <button class="tb" data-key="a">◀</button>
  <button class="tb" data-key="d">▶</button>
</div>
<div id="touchRight">
  <button class="tb brake" data-key="s">刹车</button>
  <button class="tb big" data-key="w">油门</button>
</div>

<div id="selection">
  <h1>超跑竞速</h1>
  <p class="sub">选赛道 · 选车 · 20 秒排位 · 3 圈正赛 · 按 M 显示赛车线</p>
  <div class="section-title">选择赛道</div>
  <div id="tracks"></div>
  <div class="section-title">选择赛车</div>
  <div id="cars"></div>
  <button id="startBtn" disabled>进入排位赛</button>
</div>

<div id="overlayMsg">
  <h2 id="msgTitle">比赛结束</h2>
  <p id="msgBody"></p>
  <button onclick="location.reload()">再来一局</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. 车辆数据
   ============================================================ */
const CAR_DB = [
  { id:'sf90',      name:'Ferrari SF90 Stradale',    hp:986,  zeroTo100:2.5, topSpeed:340, weight:1570, color:0xd62828, accent:0xffffff },
  { id:'revuelto',  name:'Lamborghini Revuelto',     hp:1001, zeroTo100:2.5, topSpeed:350, weight:1772, color:0xe0a800, accent:0x111111 },
  { id:'temerario', name:'Lamborghini Temerario',    hp:920,  zeroTo100:2.2, topSpeed:343, weight:1898, color:0xf0c419, accent:0x222222 },
  { id:'911ts',     name:'Porsche 911 Turbo S',      hp:641,  zeroTo100:2.5, topSpeed:322, weight:1770, color:0xc0c6d1, accent:0x111111 },
  { id:'amg_one',   name:'Mercedes-AMG ONE',         hp:1063, zeroTo100:2.9, topSpeed:352, weight:1695, color:0x1c1f26, accent:0x8fd3ff },
  { id:'senna',     name:'McLaren Senna',            hp:800,  zeroTo100:2.8, topSpeed:335, weight:1198, color:0xff6b00, accent:0x111111 },
  { id:'jesko',     name:'Koenigsegg Jesko Absolut', hp:1600, zeroTo100:2.5, topSpeed:498, weight:1320, color:0x2a2d35, accent:0xd4af37 },
  { id:'chiron',    name:'Bugatti Chiron SS 300+',   hp:1600, zeroTo100:2.4, topSpeed:490, weight:1995, color:0x143a66, accent:0xffffff }
];

function buildCarSpec(db) {
  const topSpeedMs = (db.topSpeed / 3.6) * 0.65;
  const accel      = (100 / 3.6) / db.zeroTo100 * 0.85;
  const p2w        = db.hp / db.weight;
  const steer      = THREE.MathUtils.clamp(1.05 + (p2w - 0.5) * 0.3, 1.0, 1.55);
  const brake      = 14 + (db.hp / 1000) * 5.5;
  return { ...db, topSpeedMs, accel, brake, steer, reverseMax: -12 };
}
const SPECS = CAR_DB.map(buildCarSpec);

// 尾翼差异
const WING_DB = {
  sf90:      { width: 2.00, height: 0.14, y: 1.24, z: 1.88 },
  revuelto:  { width: 2.05, height: 0.18, y: 1.30, z: 1.92 },
  temerario: { width: 2.00, height: 0.16, y: 1.28, z: 1.90 },
  '911ts':   { width: 1.90, height: 0.10, y: 1.34, z: 1.76 },
  amg_one:   { width: 2.10, height: 0.22, y: 1.34, z: 1.92 },
  senna:     { width: 2.30, height: 0.36, y: 1.44, z: 1.98 },
  jesko:     { width: 2.20, height: 0.25, y: 1.40, z: 2.02 },
  chiron:    { width: 2.15, height: 0.20, y: 1.34, z: 1.92 }
};

/* ============================================================
   2. 赛道定义
   ============================================================ */
const TRACK_DEFS = [
  {
    id: 'valley',
    name: 'Apex Valley · 高速环道',
    desc: '大直道 + 高速弯，适合测试极速',
    width: 24,
    points: [
      [-480,0,0],[-380,0,280],[-140,0,440],[200,0,480],[500,0,320],[640,0,0],
      [520,0,-320],[180,0,-480],[-180,0,-420],[-420,0,-220]
    ]
  },
  {
    id: 'harbor',
    name: 'Harbor Point · 技术赛道',
    desc: '短弯密布，刹车点和出弯更重要',
    width: 16,
    points: [
      [-320,0,0],[-280,0,200],[-120,0,320],[60,0,320],[200,0,220],[220,0,60],
      [100,0,-20],[180,0,-160],[60,0,-300],[-120,0,-320],[-260,0,-220],[-340,0,-80]
    ]
  },
  {
    id: 'ring',
    name: 'Nordschleife Lite · 综合赛道',
    desc: '长距离混合弯，节奏变化大',
    width: 18,
    points: [
      [-620,0,0],[-580,0,320],[-380,0,540],[-100,0,580],[140,0,460],[80,0,300],
      [-100,0,240],[80,0,120],[340,0,180],[480,0,0],[360,0,-220],[120,0,-280],
      [-80,0,-420],[-320,0,-540],[-540,0,-360]
    ]
  }
];

/* ============================================================
   3. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9ab0c8, 600, 2800);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 5000);

/* ============================================================
   4. 天空 + 环境反射
   ============================================================ */
const skyVert = `
varying vec3 vWorldPosition;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPosition = wp.xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const skyFrag = `
uniform vec3 topColor;
uniform vec3 bottomColor;
uniform vec3 horizonColor;
uniform float offset;
uniform float exponent;
varying vec3 vWorldPosition;
void main() {
  float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
  float t = pow(max(h, 0.0), exponent);
  vec3 col;
  if (h < 0.02) {
    col = mix(horizonColor, bottomColor, clamp(-h * 4.0, 0.0, 1.0));
  } else {
    col = mix(horizonColor, topColor, clamp(t, 0.0, 1.0));
  }
  gl_FragColor = vec4(col, 1.0);
}`;

function makeSkyMaterial(top, horizon, bottom) {
  return new THREE.ShaderMaterial({
    uniforms: {
      topColor:     { value: new THREE.Color(top) },
      horizonColor: { value: new THREE.Color(horizon) },
      bottomColor:  { value: new THREE.Color(bottom) },
      offset:       { value: 600 },
      exponent:     { value: 0.65 }
    },
    vertexShader: skyVert,
    fragmentShader: skyFrag,
    side: THREE.BackSide,
    depthWrite: false
  });
}

const sky = new THREE.Mesh(new THREE.SphereGeometry(3400, 32, 16), makeSkyMaterial(0x1c3f6e, 0xd0e0f0, 0x6a8098));
sky.renderOrder = -1;
scene.add(sky);

// 用 PMREMGenerator 生成环境贴图，让车漆有反射
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), makeSkyMaterial(0x1c3f6e, 0xd0e0f0, 0x6a8098)));
  const sunBall = new THREE.Mesh(
    new THREE.SphereGeometry(14, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  sunBall.position.set(80, 120, 50);
  envScene.add(sunBall);
  const envGround = new THREE.Mesh(
    new THREE.CircleGeometry(300, 24),
    new THREE.MeshBasicMaterial({ color: 0x2a3340 })
  );
  envGround.rotation.x = -Math.PI / 2;
  envGround.position.y = -40;
  envScene.add(envGround);
  const envRT = pmrem.fromScene(envScene, 0.04);
  scene.environment = envRT.texture;
  envRT.dispose();
}

/* ============================================================
   5. 灯光
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xd0e4ff, 0x2a3428, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4e0, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -180;
sun.shadow.camera.right  = 180;
sun.shadow.camera.top    = 180;
sun.shadow.camera.bottom = -180;
sun.shadow.camera.near = 1;
sun.shadow.camera.far  = 600;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   6. 地面 + 远山 + 树木 + 云
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshStandardMaterial({ color: 0x2a3a2a, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.12;
ground.receiveShadow = true;
scene.add(ground);

// 远山
{
  const mountainMat = new THREE.MeshStandardMaterial({ color: 0x354055, roughness: 1, flatShading: true });
  const snowMat = new THREE.MeshStandardMaterial({ color: 0xdfe8f0, roughness: 0.9, flatShading: true });
  for (let i = 0; i < 50; i++) {
    const angle = (i / 50) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
    const dist = 1500 + Math.random() * 900;
    const h = 200 + Math.random() * 420;
    const r = 180 + Math.random() * 260;
    const mountain = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mountainMat);
    mountain.position.set(Math.cos(angle) * dist, h / 2 - 30, Math.sin(angle) * dist);
    mountain.rotation.y = Math.random() * Math.PI;
    scene.add(mountain);
    if (h > 400) {
      const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.32, h * 0.22, 7), snowMat);
      cap.position.copy(mountain.position).setY(h / 2 - 30 + h * 0.39);
      cap.rotation.y = mountain.rotation.y;
      scene.add(cap);
    }
  }
}

// 树木
{
  const COUNT = 900;
  const trunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 3.5, 5);
  const foliageGeo = new THREE.ConeGeometry(2.6, 6.5, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2e2014, roughness: 1 });
  const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1c4228, roughness: 1, flatShading: true });

  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, COUNT);
  const foliages = new THREE.InstancedMesh(foliageGeo, foliageMat, COUNT);
  const dummy = new THREE.Object3D();

  for (let i = 0; i < COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 780 + Math.random() * 1500;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    const scale = 0.7 + Math.random() * 1.3;
    dummy.position.set(x, 1.75 * scale, z);
    dummy.scale.setScalar(scale);
    dummy.rotation.set(0, Math.random() * Math.PI, 0);
    dummy.updateMatrix();
    trunks.setMatrixAt(i, dummy.matrix);
    dummy.position.y = 3.5 * scale + 3.0 * scale;
    dummy.updateMatrix();
    foliages.setMatrixAt(i, dummy.matrix);
  }
  scene.add(trunks, foliages);
}

// 云
{
  const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, fog: false });
  for (let i = 0; i < 14; i++) {
    const g = new THREE.Group();
    for (let k = 0; k < 5; k++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(30 + Math.random() * 25, 8, 6), cloudMat);
      s.position.set((Math.random() - 0.5) * 140, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 60);
      s.scale.y = 0.5;
      g.add(s);
    }
    const a = Math.random() * Math.PI * 2;
    const d = 1200 + Math.random() * 1600;
    g.position.set(Math.cos(a) * d, 380 + Math.random() * 260, Math.sin(a) * d);
    scene.add(g);
  }
}

/* ============================================================
   7. 车辆模型（挤压车身 + 细节）
   ============================================================ */
const CAR_HALF_L = 2.15;
const CAR_HALF_W = 1.05;

function createWheel(tyreMat, rimMat, brakeMat) {
  const g = new THREE.Group();
  const tyre = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.32, 24), tyreMat);
  tyre.rotation.z = Math.PI / 2;
  tyre.castShadow = true;
  g.add(tyre);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.33, 16), rimMat);
  hub.rotation.z = Math.PI / 2;
  g.add(hub);

  for (let i = 0; i < 5; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.09), rimMat);
    spoke.rotation.x = (i / 5) * Math.PI * 2;
    spoke.position.x = 0.06;
    g.add(spoke);
  }

  const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.09), brakeMat);
  caliper.position.set(0.12, 0.16, 0.04);
  g.add(caliper);

  return g;
}

function createCarMesh(spec) {
  const g = new THREE.Group();

  const paintMat  = new THREE.MeshStandardMaterial({ color: spec.color, metalness: 0.85, roughness: 0.28, envMapIntensity: 1.3 });
  const carbonMat = new THREE.MeshStandardMaterial({ color: 0x0e0e12, metalness: 0.55, roughness: 0.42 });
  const glassMat  = new THREE.MeshPhysicalMaterial({ color: 0x081018, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.82, envMapIntensity: 1.6 });
  const tyreMat   = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.95 });
  const rimMat    = new THREE.MeshStandardMaterial({ color: 0x1a1c22, metalness: 1, roughness: 0.25 });
  const brakeMat  = new THREE.MeshStandardMaterial({ color: 0xd02020, metalness: 0.4, roughness: 0.5 });
  const headMat   = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xd0e8ff, emissiveIntensity: 2.4 });
  const tailMat   = new THREE.MeshStandardMaterial({ color: 0xff2233, emissive: 0xff1020, emissiveIntensity: 3.0 });

  // 车身轮廓（侧视）
  const shape = new THREE.Shape();
  shape.moveTo(-2.10, 0.28);
  shape.lineTo(-2.15, 0.42);
  shape.lineTo(-1.85, 0.58);
  shape.lineTo(-1.35, 0.72);
  shape.lineTo(-0.55, 0.82);
  shape.lineTo(-0.15, 1.22);
  shape.lineTo( 0.55, 1.25);
  shape.lineTo( 1.15, 0.98);
  shape.lineTo( 1.70, 0.92);
  shape.lineTo( 2.05, 0.78);
  shape.lineTo( 2.15, 0.50);
  shape.lineTo( 2.10, 0.28);
  shape.lineTo(-2.10, 0.28);

  const bodyGeo = new THREE.ExtrudeGeometry(shape, {
    depth: 2.0, bevelEnabled: true, bevelThickness: 0.04,
    bevelSize: 0.04, bevelSegments: 2, curveSegments: 2
  });
  bodyGeo.translate(0, 0, -1.0);
  bodyGeo.rotateY(-Math.PI / 2);
  const body = new THREE.Mesh(bodyGeo, paintMat);
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  // 底盘
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.15, 3.9), carbonMat);
  chassis.position.y = 0.18;
  chassis.castShadow = true;
  g.add(chassis);

  // 前唇
  const splitter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.06, 0.35), carbonMat);
  splitter.position.set(0, 0.18, -2.0);
  splitter.castShadow = true;
  g.add(splitter);

  // 侧裙

  // 前格栅
  const grille = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.18, 0.06), carbonMat);
  grille.position.set(0, 0.35, -2.12);
  g.add(grille);

  // 尾灯
  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 0.06), tailMat);
  tail.position.set(0, 0.78, 2.12);

  // 后视镜
  for (const s of [-1, 1]) {
    const stalk = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.2), carbonMat);
    stalk.position.set(s * 1.05, 0.95, -0.55);
    g.add(stalk);
    const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.08), paintMat);
    mirror.position.set(s * 1.15, 0.98, -0.5);
    g.add(mirror);
  }

  // 尾翼
  const w = WING_DB[spec.id] || { width: 2.0, height: 0.15, y: 1.3, z: 1.9 };
  for (const s of [-1, 1]) {
    const stand = new THREE.Mesh(new THREE.BoxGeometry(0.06, w.height, 0.15), carbonMat);
    stand.position.set(s * 0.75, w.y - w.height / 2, w.z);

  return g;
}

/* ============================================================
   8. 赛道构建（含护栏 / 广告牌）
   ============================================================ */
const up = new THREE.Vector3(0, 1, 0);
let currentTrack = null;
let trackGroup = null;

function buildTrack(def) {
  const pts = def.points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  const width = def.width;
  const sampleCount = Math.max(500, Math.min(1400, Math.round(curve.getLength() / 3.5)));
  const raw = curve.getSpacedPoints(sampleCount);
  const centers = raw.slice(0, sampleCount);
  const N = centers.length;

  const data = centers.map((p, i) => {
    const t = curve.getTangentAt(i / N).normalize();
    const s = new THREE.Vector3().crossVectors(t, up).normalize();
    return { point: p.clone(), tangent: t, side: s };
  });

  const leftPts  = data.map(d => d.point.clone().addScaledVector(d.side, -width / 2));
  const rightPts = data.map(d => d.point.clone().addScaledVector(d.side,  width / 2));

  let totalLen = 0;
  for (let i = 0; i < N; i++) totalLen += centers[i].distanceTo(centers[(i + 1) % N]);
  const avgSpacing = totalLen / N;

  // 赛车线
  const MAX_OFF = width / 2 - 2.5;
  const offsets = new Float32Array(N);
  const tmp = centers.map(p => p.clone());
  for (let iter = 0; iter < 250; iter++) {
    for (let i = 0; i < N; i++) {
      const prev = tmp[(i - 1 + N) % N];
      const next = tmp[(i + 1) % N];
      const mid = prev.clone().add(next).multiplyScalar(0.5);
      const target = tmp[i].clone().lerp(mid, 0.35);
      const rel = target.clone().sub(centers[i]);
      offsets[i] = THREE.MathUtils.clamp(rel.dot(data[i].side), -MAX_OFF, MAX_OFF);
    }
    for (let i = 0; i < N; i++) {
      tmp[i] = centers[i].clone().addScaledVector(data[i].side, offsets[i]);
    }
  }
  const racingLine = tmp.map(p => p.clone());

  const curvature = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const prev = racingLine[(i - 1 + N) % N];
    const cur  = racingLine[i];
    const next = racingLine[(i + 1) % N];
    const v1 = new THREE.Vector3().subVectors(cur, prev);
    const v2 = new THREE.Vector3().subVectors(next, cur);
    const len1 = v1.length(), len2 = v2.length();
    if (len1 < 1e-6 || len2 < 1e-6) continue;
    const cross = v1.x * v2.z - v1.z * v2.x;
    const dot   = v1.x * v2.x + v1.z * v2.z;
    curvature[i] = Math.abs(Math.atan2(cross, dot)) / ((len1 + len2) / 2);
  }

  return { def, curve, width, centers, data, N, leftPts, rightPts, racingLine, offsets, curvature, totalLen, avgSpacing };
}

function makeBannerTexture(text, bg) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 128);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 68px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 68);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

const BANNER_DATA = [
  ['HYPERCAR', '#c82020'], ['APEX', '#0c6a3a'], ['TURBO', '#1a3f9a'],
  ['VELOCITY', '#a01670'], ['GRIP', '#8a5a00'], ['PRECISION', '#222a3a']
];

function buildTrackMeshes(track) {
  const g = new THREE.Group();
  const N = track.N, W = track.width;

  // 路面
  const positions = [], indices = [];
  for (let i = 0; i < N; i++) {
    const l = track.leftPts[i], r = track.rightPts[i];
    positions.push(l.x, 0.02, l.z, r.x, 0.02, r.z);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = ((i + 1) % N) * 2;
    indices.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const road = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x2a2d34, roughness: 0.88, metalness: 0.06
  }));
  road.receiveShadow = true;
  g.add(road);

  // 路肩（红白条纹贴片）
  const kerbPositions = [], kerbColors = [];
  const red  = new THREE.Color(0xd02020);
  const white = new THREE.Color(0xf0f0f0);
  const KERB_W = 1.2;
  for (const sideSign of [-1, 1]) {
    for (let i = 0; i < N; i++) {
      const next = (i + 1) % N;
      const d = track.data[i], dn = track.data[next];
      const inA = d.point.clone().addScaledVector(d.side, sideSign * (W / 2));
      const outA = d.point.clone().addScaledVector(d.side, sideSign * (W / 2 + KERB_W));
      const inB = dn.point.clone().addScaledVector(dn.side, sideSign * (W / 2));
      const outB = dn.point.clone().addScaledVector(dn.side, sideSign * (W / 2 + KERB_W));
      const base = kerbPositions.length / 3;
      kerbPositions.push(
        inA.x, 0.025, inA.z,  outA.x, 0.025, outA.z,  inB.x, 0.025, inB.z,
        outA.x, 0.025, outA.z, outB.x, 0.025, outB.z, inB.x, 0.025, inB.z
      );
      const col = Math.floor(i / 4) % 2 === 0 ? red : white;
      for (let k = 0; k < 6; k++) kerbColors.push(col.r, col.g, col.b);
    }
  }
  const kerbGeo = new THREE.BufferGeometry();
  kerbGeo.setAttribute('position', new THREE.Float32BufferAttribute(kerbPositions, 3));
  kerbGeo.setAttribute('color', new THREE.Float32BufferAttribute(kerbColors, 3));
  const kerb = new THREE.Mesh(kerbGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 }));
  kerb.receiveShadow = true;
  g.add(kerb);

  // 中央虚线
  for (let i = 0; i < N; i += 8) {
    const d = track.data[i];
    const dash = new THREE.Mesh(
      new THREE.PlaneGeometry(0.4, 3),
      new THREE.MeshBasicMaterial({ color: 0x606878 })
    );
    dash.rotation.x = -Math.PI / 2;
    dash.rotation.z = Math.atan2(d.tangent.x, d.tangent.z);
    dash.position.copy(d.point).setY(0.03);
    g.add(dash);
  }

  // 护栏立柱（InstancedMesh）
  const postStep = 4;
  const postGeo = new THREE.BoxGeometry(0.18, 1.1, 0.18);
  const postMat = new THREE.MeshStandardMaterial({ color: 0x9aa0ac, metalness: 0.7, roughness: 0.35 });
  const count = Math.floor(N / postStep) * 2;
  const posts = new THREE.InstancedMesh(postGeo, postMat, count);
  const dummy = new THREE.Object3D();
  let pi = 0;
  for (let i = 0; i < N; i += postStep) {
    for (const s of [-1, 1]) {
      const p = track.data[i].point.clone().addScaledVector(track.data[i].side, s * (W / 2 + 1.4));
      dummy.position.set(p.x, 0.55, p.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      posts.setMatrixAt(pi++, dummy.matrix);
    }
  }
  posts.castShadow = true;
  g.add(posts);

  // 护栏横杆
  for (const s of [-1, 1]) {
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const idx = i % N;
      const p = track.data[idx].point.clone().addScaledVector(track.data[idx].side, s * (W / 2 + 1.4));
      p.y = 1.0;
      pts.push(p);
    }
    g.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0xc0c8d8 })
    ));
  }

  // 广告牌
  let bannerIdx = 0;
  for (let i = 20; i < N; i += 30) {
    const d = track.data[i];
    const side = (i / 30) % 2 === 0 ? 1 : -1;
    const p = d.point.clone().addScaledVector(d.side, side * (W / 2 + 5));
    p.y = 2.2;
    const [text, bg] = BANNER_DATA[bannerIdx % BANNER_DATA.length];
    bannerIdx++;
    const tex = makeBannerTexture(text, bg);
    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
    const board = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), mat);
    board.position.copy(p);
    board.rotation.y = Math.atan2(-d.side.x * side, -d.side.z * side);
    g.add(board);

    for (const off of [-3.2, 3.2]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2, 0.15), postMat);
      const legPos = p.clone().addScaledVector(d.tangent, off);
      leg.position.set(legPos.x, 1, legPos.z);
      g.add(leg);
    }
  }

  // 起终点线
  {
    const d = track.data[0];
    const line = new THREE.Mesh(new THREE.PlaneGeometry(W, 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    line.rotation.x = -Math.PI / 2;
    line.rotation.z = Math.atan2(d.tangent.x, d.tangent.z);
    line.position.copy(d.point).setY(0.035);
    g.add(line);
  }

  // 赛车线
  const rlGeo = new THREE.BufferGeometry().setFromPoints(track.racingLine.concat([track.racingLine[0]]));
  const rlMesh = new THREE.Line(rlGeo, new THREE.LineBasicMaterial({ color: 0xffd166 }));
  rlMesh.name = 'racingLine';
  rlMesh.visible = false;
  g.add(rlMesh);

  return g;
}

function disposeTrackGroup() {
  if (!trackGroup) return;
  scene.remove(trackGroup);
  trackGroup.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
  trackGroup = null;
}

function loadTrack(def) {
  disposeTrackGroup();
  currentTrack = buildTrack(def);
  trackGroup = buildTrackMeshes(currentTrack);
  scene.add(trackGroup);
  buildMinimapBackground(currentTrack);
  speedProfileCache.clear();
}

addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'm' && trackGroup) {
    const rl = trackGroup.getObjectByName('racingLine');
    if (rl) rl.visible = !rl.visible;
  }
});

/* ============================================================
   9. OBB 碰撞
   ============================================================ */
function getOBB(pos, heading) {
  const cos = Math.cos(heading), sin = Math.sin(heading);
  return {
    cx: pos.x, cz: pos.z,
    fx: -sin, fz: -cos,
    rx: cos,  rz: -sin,
    halfL: CAR_HALF_L, halfW: CAR_HALF_W
  };
}
function projectOBB(o, ax, az) {
  const c = o.cx * ax + o.cz * az;
  const r = Math.abs(o.fx * ax + o.fz * az) * o.halfL + Math.abs(o.rx * ax + o.rz * az) * o.halfW;
  return [c - r, c + r];
}
function obbMTV(a, b) {
  const axes = [[a.fx, a.fz], [a.rx, a.rz], [b.fx, b.fz], [b.rx, b.rz]];
  let minOv = Infinity, bestAxis = null;
  for (const [ax, az] of axes) {
    const pa = projectOBB(a, ax, az);
    const pb = projectOBB(b, ax, az);
    const ov = Math.min(pa[1], pb[1]) - Math.max(pa[0], pb[0]);
    if (ov <= 0) return null;
    if (ov < minOv) { minOv = ov; bestAxis = [ax, az]; }
  }
  const dx = a.cx - b.cx, dz = a.cz - b.cz;
  const dir = (dx * bestAxis[0] + dz * bestAxis[1]) >= 0 ? 1 : -1;
  return { ax: bestAxis[0], az: bestAxis[1], depth: minOv, dir };
}
function carHalfSpanOnSide(heading, side) {
  const cos = Math.cos(heading), sin = Math.sin(heading);
  const fx = -sin, fz = -cos, rx = cos, rz = -sin;
  return Math.abs(rx * side.x + rz * side.z) * CAR_HALF_W
       + Math.abs(fx * side.x + fz * side.z) * CAR_HALF_L;
}

function resolveTrackCollision(racer) {
  const track = currentTrack;
  const { mesh, state } = racer;
  const idx = nearestIdxByHint(mesh.position, track.centers, state.lastTrackIdx, 12);
  state.lastTrackIdx = idx;
  const info = track.data[idx];

  const lat = new THREE.Vector3().subVectors(mesh.position, info.point).dot(info.side);
  const halfSpan = carHalfSpanOnSide(state.heading, info.side);
  const limit = track.width / 2 - halfSpan;
  if (Math.abs(lat) > limit) {
    const pen = Math.abs(lat) - limit;
    const sign = Math.sign(lat) || 1;
    mesh.position.addScaledVector(info.side, -sign * pen);
    state.speed *= 0.82;
    const fwd = new THREE.Vector3(-Math.sin(state.heading), 0, -Math.cos(state.heading));
    const dotT = fwd.dot(info.tangent);
    const targetHeading = dotT >= 0
      ? Math.atan2(-info.tangent.x, -info.tangent.z)
      : Math.atan2(info.tangent.x, info.tangent.z);
    let diff = targetHeading - state.heading;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    state.heading += diff * 0.35;
    return true;
  }
  return false;
}

function resolveCarCarCollisions() {
  for (let i = 0; i < allRacers.length; i++) {
    for (let j = i + 1; j < allRacers.length; j++) {
      const a = allRacers[i], b = allRacers[j];
      const oa = getOBB(a.mesh.position, a.state.heading);
      const ob = getOBB(b.mesh.position, b.state.heading);
      const mtv = obbMTV(oa, ob);
      if (!mtv) continue;
      const push = mtv.depth * 0.5;
      a.mesh.position.x += mtv.ax * mtv.dir * push;
      a.mesh.position.z += mtv.az * mtv.dir * push;
      b.mesh.position.x -= mtv.ax * mtv.dir * push;
      b.mesh.position.z -= mtv.az * mtv.dir * push;
      const vA = new THREE.Vector3(-Math.sin(a.state.heading), 0, -Math.cos(a.state.heading)).multiplyScalar(a.state.speed);
      const vB = new THREE.Vector3(-Math.sin(b.state.heading), 0, -Math.cos(b.state.heading)).multiplyScalar(b.state.speed);
      const nA = new THREE.Vector3(mtv.ax * mtv.dir, 0, mtv.az * mtv.dir);
      const nB = nA.clone().negate();
      vA.addScaledVector(nA, -vA.dot(nA) * 1.4);
      vB.addScaledVector(nB, -vB.dot(nB) * 1.4);
      a.state.speed = THREE.MathUtils.clamp(vA.length() * Math.sign(a.state.speed || 1) * 0.92, a.spec.reverseMax, a.spec.topSpeedMs);
      b.state.speed = THREE.MathUtils.clamp(vB.length() * Math.sign(b.state.speed || 1) * 0.92, b.spec.reverseMax, b.spec.topSpeedMs);
    }
  }
}

/* ============================================================
   10. 最近点 / 速度曲线
   ============================================================ */
function nearestIdxByHint(pos, arr, hint, window = 10) {
  const n = arr.length;
  let best = 0, bestD = Infinity;
  if (hint >= 0 && hint < n) {
    for (let d = -window; d <= window; d++) {
      const i = (hint + d + n) % n;
      const dist = pos.distanceToSquared(arr[i]);
      if (dist < bestD) { bestD = dist; best = i; }
    }
    if (bestD < 2500) return best;
  }
  for (let i = 0; i < n; i++) {
    const dist = pos.distanceToSquared(arr[i]);
    if (dist < bestD) { bestD = dist; best = i; }
  }
  return best;
}

const speedProfileCache = new Map();
function computeSpeedProfile(spec, track) {
  const key = spec.id + '@' + track.def.id;
  if (speedProfileCache.has(key)) return speedProfileCache.get(key);
  const N = track.N;
  const v = new Float32Array(N);
  const aLat   = 16 + spec.hp / 160;
  const aBrake = spec.brake * 0.9;
  const aAccel = spec.accel * 0.9;
  const vmax   = spec.topSpeedMs;
  for (let i = 0; i < N; i++) {
    const k = Math.max(track.curvature[i], 1e-4);
    v[i] = Math.min(Math.sqrt(aLat / k), vmax);
  }
  for (let iter = 0; iter < 6; iter++) {
    for (let i = N - 1; i >= 0; i--) {
      const next = (i + 1) % N;
      const ds = track.racingLine[i].distanceTo(track.racingLine[next]);
      const limit = Math.sqrt(v[next] * v[next] + 2 * aBrake * ds);
      if (v[i] > limit) v[i] = limit;
    }
    for (let i = 0; i < N; i++) {
      const next = (i + 1) % N;
      const ds = track.racingLine[i].distanceTo(track.racingLine[next]);
      const limit = Math.sqrt(v[i] * v[i] + 2 * aAccel * ds);
      if (v[next] > limit) v[next] = limit;
    }
  }
  for (let i = 0; i < N; i++) {
    const k = Math.max(track.curvature[i], 1e-4);
    v[i] = Math.min(v[i], vmax, Math.sqrt(aLat / k));
  }
  speedProfileCache.set(key, v);
  return v;
}

      finished: false, speedProfile: computeSpeedProfile(spec, currentTrack)
    };
    allRacers.push({ mesh, state: st, spec, isPlayer: false, aiSkill: 0.9 + Math.random() * 0.1 });
  }
  enterQualifying();
}

function enterQualifying() {
  const track = currentTrack;
  const startIdx = (track.N - 20) % track.N;
  const maxLat = track.width / 2 - 2.5;
  allRacers.forEach((racer, i) => {
    const lateral = -maxLat + (i / (allRacers.length - 1)) * 2 * maxLat;
    const info = track.data[startIdx];
    racer.mesh.position.copy(info.point).addScaledVector(info.side, lateral);
    racer.state.heading = Math.atan2(-info.tangent.x, -info.tangent.z);
    racer.state.speed = 0;
    racer.state.lap = 0;
    racer.state.finished = false;
    racer.state.lastProgressIdx = startIdx;
    racer.state.lastTrackIdx = startIdx;
    racer.state.lastLineIdx = -1;
    racer.mesh.rotation.y = racer.state.heading;
  });
  phase = PHASE.QUALIFYING;
  phaseTime = 0;
  snapCameraToPlayer();
}

function enterGridPhase() {
  const track = currentTrack;
  const maxLat = track.width / 2 - 3;
  const sorted = [...allRacers].sort((a, b) => getProgress(b) - getProgress(a));
  sorted.forEach((racer, i) => {
    const row = Math.floor(i / 2);
    const col = i % 2;
    const gridIdx = (track.N - 12 - row * 4 + track.N) % track.N;
    const lateral = THREE.MathUtils.clamp(col === 0 ? -maxLat * 0.6 : maxLat * 0.6, -maxLat, maxLat);
    const info = track.data[gridIdx];
    racer.mesh.position.copy(info.point).addScaledVector(info.side, lateral);
    racer.state.heading = Math.atan2(-info.tangent.x, -info.tangent.z);
    racer.state.speed = 0;
    racer.state.lap = 0;
    racer.state.finished = false;
    racer.state.lastProgressIdx = gridIdx;
    racer.state.lastTrackIdx = gridIdx;
    racer.state.lastLineIdx = -1;
    racer.mesh.rotation.y = racer.state.heading;
  });
  phase = PHASE.GRID;
  phaseTime = 0;
  goDelay = 1.2 + Math.random() * 1.8;
  snapCameraToPlayer();
  document.querySelectorAll('.light').forEach(l => l.classList.remove('red'));
}

function snapCameraToPlayer() {
  const off = new THREE.Vector3(0, 5.5, 12).applyAxisAngle(up, playerState.heading);
  camera.position.copy(playerCar.position).add(off);
  camera.lookAt(playerCar.position.x, playerCar.position.y + 1, playerCar.position.z);
}

function resetPlayerOnTrack() {
  if (!playerState || !currentTrack) return;
  const idx = playerState.lastTrackIdx >= 0 ? playerState.lastTrackIdx : 0;
  const info = currentTrack.data[idx];
  playerCar.position.copy(info.point);
  playerState.heading = Math.atan2(-info.tangent.x, -info.tangent.z);
  playerState.speed = 0;
}

function getProgress(racer) {
  return racer.state.lap + racer.state.lastProgressIdx / currentTrack.N;
}

function updateLapProgress(racer, idx) {
  const N = currentTrack.N;
  const st = racer.state;
  const prev = st.lastProgressIdx;
  if (prev > N * 0.7 && idx < N * 0.3) {
    st.lap++;
    if (phase === PHASE.RACE && st.lap > TOTAL_LAPS && !st.finished) {
      st.finished = true;
      if (racer.isPlayer) finishRace();
    }
  }
  st.lastProgressIdx = idx;
}

/* ============================================================
   12. 玩家 / AI
   ============================================================ */
function updatePlayer(dt) {
  if (playerState.finished) return;
  if (phase !== PHASE.QUALIFYING && phase !== PHASE.RACE) return;
  const spec = playerSpec;
  const throttle = (keys['w'] || keys['arrowup']) ? 1 : 0;
  const brake    = (keys['s'] || keys['arrowdown']) ? 1 : 0;
  const steer    = ((keys['a'] || keys['arrowleft']) ? 1 : 0) - ((keys['d'] || keys['arrowright']) ? 1 : 0);

  const drag = spec.accel / (spec.topSpeedMs * spec.topSpeedMs);
  if (throttle) {
    playerState.speed += (spec.accel - drag * playerState.speed * playerState.speed) * dt;
  } else if (brake) {
    if (playerState.speed > 0.5) playerState.speed -= spec.brake * dt;
    else playerState.speed -= spec.accel * 0.35 * dt;
  } else {
    playerState.speed -= drag * playerState.speed * playerState.speed * dt * 1.5;
    if (Math.abs(playerState.speed) < 0.1) playerState.speed = 0;
  }
  playerState.speed = THREE.MathUtils.clamp(playerState.speed, spec.reverseMax, spec.topSpeedMs);

  if (Math.abs(playerState.speed) > 0.5) {
    const ratio = Math.min(1, Math.abs(playerState.speed) / spec.topSpeedMs);
    const yawRate = spec.steer * 1.9 * (1 - 0.45 * ratio);
    playerState.heading += steer * yawRate * dt * Math.sign(playerState.speed);
  }

  const fwd = new THREE.Vector3(-Math.sin(playerState.heading), 0, -Math.cos(playerState.heading));
  playerCar.position.addScaledVector(fwd, playerState.speed * dt);
  playerCar.rotation.y = playerState.heading;
  resolveTrackCollision({ mesh: playerCar, state: playerState, spec: playerSpec, isPlayer: true });
  updateLapProgress({ mesh: playerCar, state: playerState, spec: playerSpec, isPlayer: true }, playerState.lastTrackIdx);
}

function updateAI(racer, dt) {
  if (racer.state.finished) return;
  if (phase !== PHASE.QUALIFYING && phase !== PHASE.RACE) return;
  const track = currentTrack;
  const { mesh, state, spec } = racer;

  const lineIdx = nearestIdxByHint(mesh.position, track.racingLine, state.lastLineIdx, 12);
  state.lastLineIdx = lineIdx;
  const lookDist = 12 + state.speed * 0.4;
  const lookAhead = Math.max(3, Math.round(lookDist / track.avgSpacing));
  const target = track.racingLine[(lineIdx + lookAhead) % track.N].clone();

  const ti = nearestIdxByHint(mesh.position, track.centers, state.lastTrackIdx, 12);
  state.lastTrackIdx = ti;
  const info = track.data[ti];

  for (const other of allRacers) {
    if (other === racer) continue;
    const d = mesh.position.distanceTo(other.mesh.position);
    if (d < 9) {
      const toOther = new THREE.Vector3().subVectors(other.mesh.position, mesh.position);
      const fwd = new THREE.Vector3(-Math.sin(state.heading), 0, -Math.cos(state.heading));
      if (toOther.dot(fwd) > 0.3) {
        target.addScaledVector(info.side, toOther.dot(info.side) > 0 ? -3 : 3);
        break;
      }
    }
  }

  const toTarget = new THREE.Vector3().subVectors(target, mesh.position);
  const desired = Math.atan2(-toTarget.x, -toTarget.z);
  let diff = desired - state.heading;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const turnRate = 2.8 * spec.steer;
  state.heading += THREE.MathUtils.clamp(diff, -turnRate * dt, turnRate * dt);

  const targetSpeed = state.speedProfile[lineIdx] * racer.aiSkill;
  if (state.speed < targetSpeed) state.speed = Math.min(targetSpeed, state.speed + spec.accel * dt);
  else                          state.speed = Math.max(targetSpeed, state.speed - spec.brake * dt);
  state.speed = THREE.MathUtils.clamp(state.speed, 0, spec.topSpeedMs);

  const fwd = new THREE.Vector3(-Math.sin(state.heading), 0, -Math.cos(state.heading));
  mesh.position.addScaledVector(fwd, state.speed * dt);
  mesh.rotation.y = state.heading;
  resolveTrackCollision(racer);
  updateLapProgress(racer, state.lastTrackIdx);
}

/* ============================================================
   13. 阶段 / HUD / 结束
   ============================================================ */
const lightEls = document.querySelectorAll('.light');
function updatePhase(dt) {
  if (phase === PHASE.QUALIFYING) {
    phaseTime += dt;
    document.getElementById('phaseText').textContent =
      `排位赛 ${Math.max(0, QUALIFY_DURATION - phaseTime).toFixed(1)}s`;
    if (phaseTime >= QUALIFY_DURATION) enterGridPhase();
  } else if (phase === PHASE.GRID) {
    phaseTime += dt;
    if (phaseTime < 2) {
      document.getElementById('phaseText').textContent = '排位完成 · 准备发车';
      return;
    }
    document.getElementById('phaseText').textContent = '准备发车';
    const t = phaseTime - 2;
    const lc = Math.min(5, Math.floor(t / 0.6) + 1);
    for (let i = 0; i < 5; i++) lightEls[i].classList.toggle('red', i < lc);
    if (lc >= 5 && t >= 3 + goDelay) {
      lightEls.forEach(l => l.classList.remove('red'));
      phase = PHASE.RACE;
      phaseTime = 0;
      document.getElementById('phaseText').textContent = 'GO!';
      setTimeout(() => {
        if (phase === PHASE.RACE) document.getElementById('phaseText').textContent = '';
      }, 900);
    }
  }
}

function updateHud() {
  if (!playerState) return;
  document.getElementById('spd').textContent = Math.round(Math.abs(playerState.speed) * 3.6);
  document.getElementById('lap').textContent = `${Math.min(Math.max(playerState.lap, 1), TOTAL_LAPS)} / ${TOTAL_LAPS}`;
  const sorted = [...allRacers].sort((a, b) => getProgress(b) - getProgress(a));
  document.getElementById('pos').textContent = `${sorted.findIndex(r => r.isPlayer) + 1} / ${allRacers.length}`;
}

function finishRace() {
  if (raceFinished) return;
  raceFinished = true;
  phase = PHASE.FINISHED;
  const sorted = [...allRacers].sort((a, b) => getProgress(b) - getProgress(a));
  const pos = sorted.findIndex(r => r.isPlayer) + 1;
  document.getElementById('msgTitle').textContent = pos === 1 ? '🏆 冠军！' : `完赛 · 第 ${pos} 名`;
  document.getElementById('msgBody').textContent = `驾驶 ${playerSpec.name} 完成 ${TOTAL_LAPS} 圈`;
  document.getElementById('overlayMsg').style.display = 'flex';
}

/* ============================================================
   14. 小地图
   ============================================================ */
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const MM_W = 340, MM_H = 340;
mmCanvas.width = MM_W; mmCanvas.height = MM_H;
let mmBg = null, mmMapping = null;

function buildMinimapBackground(track) {
  mmBg = document.createElement('canvas');
  mmBg.width = MM_W; mmBg.height = MM_H;
  const c = mmBg.getContext('2d');
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of track.centers) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z);
  }
  const pad = 26;
  const scale = Math.min((MM_W - pad * 2) / (maxX - minX), (MM_H - pad * 2) / (maxZ - minZ));
  const offX = (MM_W - (maxX - minX) * scale) / 2;
  const offZ = (MM_H - (maxZ - minZ) * scale) / 2;
  mmMapping = (x, z) => [offX + (x - minX) * scale, offZ + (z - minZ) * scale];

  c.fillStyle = 'rgba(79,124,255,0.25)';
  c.beginPath();
  for (let i = 0; i < track.N; i++) {
    const [x, y] = mmMapping(track.leftPts[i].x, track.leftPts[i].z);
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  for (let i = track.N - 1; i >= 0; i--) {
    const [x, y] = mmMapping(track.rightPts[i].x, track.rightPts[i].z);
    c.lineTo(x, y);
  }
  c.closePath(); c.fill();

  c.strokeStyle = 'rgba(120,170,255,0.9)';
  c.lineWidth = 2; c.lineJoin = 'round';
  c.beginPath();
  for (let i = 0; i < track.N; i++) {
    const [x, y] = mmMapping(track.centers[i].x, track.centers[i].z);
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath(); c.stroke();

  const [sx, sy] = mmMapping(track.centers[0].x, track.centers[0].z);
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(sx, sy, 4, 0, Math.PI * 2); c.fill();
}

function drawMinimap() {
  mmCtx.clearRect(0, 0, MM_W, MM_H);
  if (!mmBg || !mmMapping) return;
  mmCtx.drawImage(mmBg, 0, 0);
  for (const racer of allRacers) {
    const [x, y] = mmMapping(racer.mesh.position.x, racer.mesh.position.z);
    mmCtx.beginPath();
    mmCtx.arc(x, y, racer.isPlayer ? 6 : 4, 0, Math.PI * 2);
    mmCtx.fillStyle = racer.isPlayer ? '#7dff9b' : '#ffd166';
    mmCtx.fill();
    if (racer.isPlayer) {
      mmCtx.strokeStyle = '#0b1020'; mmCtx.lineWidth = 2; mmCtx.stroke();
    }
  }
}

/* ============================================================
   15. 主循环
   ============================================================ */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const camLook = new THREE.Vector3();
const camBase = new THREE.Vector3(0, 5.5, 12);
const sunOffset = new THREE.Vector3(80, 120, 60);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updatePhase(dt);

  if (phase === PHASE.QUALIFYING || phase === PHASE.RACE) {
    updatePlayer(dt);
    for (const r of allRacers) if (!r.isPlayer) updateAI(r, dt);
    resolveCarCarCollisions();
    updateHud();
  }

  if (playerCar) {
    const heading = playerState.heading;
    const off = camBase.clone().applyAxisAngle(up, heading);
    camTarget.copy(playerCar.position).add(off);
    const smooth = 1 - Math.pow(0.0015, dt);
    camera.position.lerp(camTarget, smooth);
    const fwd = new THREE.Vector3(-Math.sin(heading), 0, -Math.cos(heading));
    camLook.copy(playerCar.position).add(new THREE.Vector3(0, 1, 0)).addScaledVector(fwd, 5);
    camera.lookAt(camLook);

    sun.target.position.copy(playerCar.position);
    sun.position.copy(playerCar.position).add(sunOffset);
    sun.target.updateMatrixWorld();
  }

  drawMinimap();
  renderer.render(scene, camera);
}

/* ============================================================
   16. UI
   ============================================================ */
const tracksWrap = document.getElementById('tracks');
const carsWrap = document.getElementById('cars');
const startBtn = document.getElementById('startBtn');

TRACK_DEFS.forEach(def => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="name">${def.name}</div>
    <div class="meta">${def.desc}<br />宽度 <b>${def.width} m</b></div>`;
  el.addEventListener('click', () => {
    tracksWrap.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedTrackDef = def;
    loadTrack(def);
    updateStartBtn();
  });
  tracksWrap.appendChild(el);
});

SPECS.forEach(spec => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="name">${spec.name}</div>
    <div class="meta">
      <b>${spec.hp}</b> hp · <b>${spec.weight}</b> kg<br />
      0-100 <b>${spec.zeroTo100}s</b> · 极速 <b>${spec.topSpeed}</b> km/h
    </div>`;
  el.addEventListener('click', () => {
    carsWrap.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedCarSpec = spec;
    playerSpec = spec;
    updateStartBtn();
  });
  carsWrap.appendChild(el);
});

function updateStartBtn() {
  if (selectedTrackDef && selectedCarSpec) {
    startBtn.classList.add('ready');
    startBtn.disabled = false;
  } else {
    startBtn.classList.remove('ready');
    startBtn.disabled = true;
  }
}

startBtn.addEventListener('click', () => {
  if (!selectedTrackDef || !selectedCarSpec) return;
  startRace();
});

// 默认选中第一条赛道预览
tracksWrap.children[0].click();

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
